apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kube-image-deployer
  namespace: kube-image-deployer
  labels:
    app: kube-image-deployer
    name: kube-image-deployer
  annotations: {}
spec:
  replicas: 1 # fixed
  selector:
    matchLabels:
      app: kube-image-deployer
      name: kube-image-deployer
  template:
    metadata:
      labels:
        app: kube-image-deployer
        name: kube-image-deployer
      annotations: {}
    spec:
      containers:
        - name: kube-image-deployer
          image: ghcr.io/pubg/kube-image-deployer:v0.1.2
          env:
            - name: SLACK_MSG_PREFIX
              value: '' # prefix for slack message
            - name: SLACK_WEBHOOK
              value: '' # your slack webhook url
          ports:
            - name: http
              containerPort: 8080 # /healthz, /readyz, /metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: dockerconfig
              readOnly: true
              mountPath: /home/kube-image-deployer/.docker # $DOCKER_CONFIG/config.json
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: dockerconfig
          secret:
            secretName: kube-image-deployer
            items:
              - key: .dockerconfigjson
                path: config.json  # $DOCKER_CONFIG/config.json
            defaultMode: 420
      restartPolicy: Always
      serviceAccountName: kube-image-deployer
      serviceAccount: kube-image-deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
  serviceName: kube-image-deployer
  updateStrategy:
    type: RollingUpdate
