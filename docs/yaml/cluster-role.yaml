apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-image-deployer
  labels:
    app: kube-image-deployer
    name: kube-image-deployer
  annotations: {}
# 최소 권한: 컨트롤러는 workload에 대해 get/list/watch/patch만 사용한다
rules:
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
  - verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - batch
    resources:
      - cronjobs
